[project]
name = "wesheildsiem"
version = "0.1.0"
description = "A learning-oriented SIEM: log ingestion, normalization to ECS, and OpenSearch storage."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "redis>=5.0",
    "opensearch-py>=2.6",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-dateutil>=2.9",
    "regex>=2024.5.15",
    "pygrok>=1.0.0",
    "geoip2>=4.8",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "testcontainers>=4.5",
    "types-pyyaml",
    "types-python-dateutil",
]

[project.scripts]
siem = "siem.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/siem"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
